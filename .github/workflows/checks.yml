name: Package checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, mbstring, openssl, curl, bcmath, sqlite, pdo_sqlite
          coverage: none
      - name: Reject tracked Composer lockfile
        run: test -z "$(git ls-files -- composer.lock)"
      - run: composer validate --strict --no-check-lock
      - run: composer lint
      - name: Configure private Composer sources
        env:
          PACKAGE_REPOSITORIES: ${{ vars.PACKAGE_REPOSITORIES }}
        run: php tools/configure-ci.php
      - name: Install dependencies
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
        run: composer update --no-interaction --prefer-dist --no-progress
      - run: composer format
      - run: composer test
